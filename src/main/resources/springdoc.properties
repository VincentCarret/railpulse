# Importe par application.properties principal et de test : une seule source pour les chemins de l'API.
# JSON sur /api/openapi, YAML sur /api/openapi.yaml, Swagger UI sur /api/swagger-ui.html
springdoc.api-docs.path=/api/openapi
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operations-sorter=method
