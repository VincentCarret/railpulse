# Démonstration autonome : base relationnelle locale, sans Supabase ni MySQL.
spring.datasource.url=jdbc:h2:file:./.data/railpulse;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.default_schema=railpulse
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/supabase-schema.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
