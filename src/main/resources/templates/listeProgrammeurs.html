<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Programmeurs · Rail Pulse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container page-content">
    <nav aria-label="Fil d’Ariane" class="mb-4"><a th:href="@{/}">Accueil</a> / Programmeurs</nav>
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div><p class="section-label">VOTRE ÉQUIPE</p><h1>Programmeurs</h1><p class="text-secondary mb-0" th:text="|${#lists.size(programmeurs)} programmeur(s) enregistré(s)|"></p></div>
        <a class="btn btn-success" th:href="@{/programmeurs/nouveau}">+ Ajouter un programmeur</a>
    </div>
    <div class="alert alert-success" role="status" th:if="${succes}" th:text="${succes}"></div>
    <div class="table-responsive table-card" tabindex="0" aria-label="Liste des programmeurs, défilement horizontal possible">
        <table class="table table-hover align-middle mb-0">
            <caption class="visually-hidden">Coordonnées et actions disponibles pour les programmeurs.</caption>
            <thead><tr><th scope="col">Nom</th><th scope="col">Prénom</th><th scope="col">Adresse</th><th scope="col">Expertise</th><th scope="col">Livre préféré</th><th scope="col">Salaire</th><th scope="col">Actions</th></tr></thead>
            <tbody>
            <tr th:each="programmeur : ${programmeurs}">
                <td th:text="${programmeur.nom}"></td><td th:text="${programmeur.prenom}"></td>
                <td th:text="${programmeur.adresse}"></td><td th:text="${programmeur.langageExpertise}"></td>
                <td th:text="${programmeur.livrePrefere}"></td><td th:text="${programmeur.salaire}"></td>
                <td><div class="d-flex gap-2">
                    <a class="btn btn-outline-success btn-sm" th:href="@{/programmeurs/{id}(id=${programmeur.id})}" th:attr="aria-label=|Modifier ${programmeur.prenom} ${programmeur.nom}|">Modifier</a>
                    <form th:action="@{/programmeurs/{id}(id=${programmeur.id})}" th:method="DELETE" data-confirm-delete>
                        <button type="submit" class="btn btn-outline-danger btn-sm" th:attr="aria-label=|Supprimer ${programmeur.prenom} ${programmeur.nom}|">Supprimer</button>
                    </form>
                </div></td>
            </tr>
            <tr th:if="${#lists.isEmpty(programmeurs)}"><td colspan="7" class="text-center text-secondary py-5">Aucun programmeur pour le moment. Ajoutez le premier membre de votre équipe.</td></tr>
            </tbody>
        </table>
    </div>
</main>
<script th:src="@{/js/programmeurs.js}" defer></script>
</body>
</html>
