<!DOCTYPE html>
<!--/* Les remarques de ce fichier sont écrites sous forme de commentaires Thymeleaf (« parser-level comments », cf. 5.5) : elles sont supprimées
       lors du rendu et ne sont donc pas envoyées au navigateur, contrairement aux commentaires HTML ordinaires, visibles dans le code source de la page. */-->
<!--/* 5.6 / note technique 2 -- Le namespace xmlns:th n'est pas obligatoire : il sert à l'IDE pour reconnaître et valider le préfixe "th:". */-->
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>ALTN72 - Rail Pulse - Liste des programmeurs</title>
    <!--/* 5.9.2 -- Feuille de style Bootstrap : à ajouter une fois la 1re version (tableau HTML brut) fonctionnelle, pour améliorer la présentation. */-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container mt-4">

    <h1>ALTN72 - Rail Pulse - Liste des programmeurs</h1>

    <!--/* 5.8 -- Première manipulation (faite en séance) : afficher le prénom du dernier programmeur de la liste.
           "prenomDernierProgrammeur" est le nom donné à l'attribut dans model.addAttribute(...) côté contrôleur ; ${...} le retrouve par ce nom.
           <p>Dernier programmeur : <span th:text="${prenomDernierProgrammeur}"></span></p>
           Remplacé ensuite par le tableau complet (5.9). */-->

    <!--/* 5.9 -- ${programmeurs} = la liste déposée dans le Model par le contrôleur (même nom que dans model.addAttribute("programmeurs", ...)).
           th:each répète la balise sur laquelle il est placé (ici <tr>) pour chaque élément de la liste : "programmeur" désigne l'élément courant. */-->
    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th scope="col">Id</th>
            <th scope="col">Nom</th>
            <th scope="col">Prénom</th>
            <th scope="col">Adresse</th>
            <th scope="col">Langage d'expertise</th>
            <th scope="col">Livre préféré</th>
            <th scope="col">Salaire</th>
            <th scope="col">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="programmeur : ${programmeurs}">
            <!--/* th:text affiche la valeur de l'expression en échappant le HTML. ${programmeur.nom} appelle getNom() sur l'objet courant. */-->
            <td th:text="${programmeur.id}"></td>
            <td th:text="${programmeur.nom}"></td>
            <td th:text="${programmeur.prenom}"></td>
            <td th:text="${programmeur.adresse}"></td>
            <td th:text="${programmeur.langageExpertise}"></td>
            <td th:text="${programmeur.livrePrefere}"></td>
            <td th:text="${programmeur.salaire}"></td>
            <td>
                <!--/* 5.12.1 -- Bouton "Modifiez" : un formulaire GET vers /programmeurs/{id}, qui affiche la page detailsProgrammeur (formulaire prérempli).
                       @{...} construit une URL (en tenant compte du contexte de l'application) ; (idProgrammeur=...) renseigne la variable {idProgrammeur} de la route. */-->
                <form th:action="@{/programmeurs/{idProgrammeur}(idProgrammeur=${programmeur.id})}" style="display:inline;">
                    <button class="btn btn-info btn-sm">Modifiez</button>
                </form>

                <!--/* 5.10.1 -- 1re version du bouton "Supprimez" : un formulaire POST ordinaire.
                       <form th:action="@{/programmeurs/{idProgrammeur}(idProgrammeur=${programmeur.id})}" method="POST" style="display:inline;">
                       5.10.2 -- Résultat : erreur 405 (Method Not Allowed). Le navigateur envoie un POST, alors que la route du contrôleur n'accepte que DELETE.
                       5.10.3 -- Solution : un champ caché "_method" dans le formulaire, lu par le HiddenHttpMethodFilter (à activer dans application.properties) :
                       <input type="hidden" name="_method" value="DELETE" />
                       Ces deux instructions se simplifient avec "th:method" : Thymeleaf envoie un POST et ajoute lui-même le champ caché _method. */-->
                <form th:action="@{/programmeurs/{idProgrammeur}(idProgrammeur=${programmeur.id})}" th:method="DELETE" style="display:inline;">
                    <button class="btn btn-warning btn-sm">Supprimez</button>
                </form>
            </td>
        </tr>
        <!--/* Cas d'une liste vide : sans cette ligne, le tableau s'afficherait sans aucune ligne, ce qui peut surprendre. */-->
        <tr th:if="${#lists.isEmpty(programmeurs)}">
            <td colspan="8" class="text-center text-muted">Aucun programmeur.</td>
        </tr>
        </tbody>
    </table>

    <!--/* 5.11.1 -- Bouton "Ajoutez" : un formulaire GET vers /programmeurs/nouveau, qui affiche le formulaire vierge (nouveauProgrammeur.html). */-->
    <form th:action="@{/programmeurs/nouveau}">
        <button class="btn btn-primary">Ajoutez</button>
    </form>

</div>
</body>
</html>
