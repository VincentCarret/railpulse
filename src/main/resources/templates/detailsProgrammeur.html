<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modifier un programmeur · Rail Pulse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container page-content">
    <nav aria-label="Fil d’Ariane" class="mb-4"><a th:href="@{/}">Accueil</a> / <a th:href="@{/programmeurs}">Programmeurs</a> / Modification</nav>
    <div class="page-heading"><p class="section-label">GESTION DES PROGRAMMEURS</p><h1>Modifier un programmeur</h1>
    <p class="text-secondary">Les champs marqués d’un astérisque (*) sont obligatoires.</p></div>
    <form class="form-card" th:object="${programmeurToUpdate}" th:action="@{/programmeurs/{id}(id=${programmeurToUpdate.id})}" th:method="PUT">
        <div th:replace="~{fragments/programmeur-fields :: fields}"></div>
        <div class="d-flex flex-wrap gap-3 mt-4">
            <button type="submit" class="btn btn-success px-4">Enregistrer les modifications</button>
            <a class="btn btn-outline-secondary" th:href="@{/programmeurs}">Annuler</a>
        </div>
    </form>
</main>
</body>
</html>
