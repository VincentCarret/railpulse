<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>ALTN72 - Rail Pulse - Un programmeur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container mt-4">
    <h1>ALTN72 - Rail Pulse - Un programmeur</h1>

    <!--/* 5.12.1 -- Formulaire dédié à la modification. Il est PRÉREMPLI :
           - th:object="${programmeurToUpdate}" rattache le formulaire à l'objet déposé dans le Model par le contrôleur (model.addAttribute("programmeurToUpdate", ...)) ;
           - th:field="*{nom}" lie le champ à l'attribut "nom" de cet objet : Thymeleaf génère les attributs id, name ET value (valeur actuelle).
             Le name généré ("nom", "prenom"...) est ce que @ModelAttribute utilise côté contrôleur pour reconstruire un Programmeur.
           Les noms des champs doivent donc être ceux des attributs de la classe Programmeur (langageExpertise, livrePrefere...), pas ceux des colonnes de la table. */-->

    <!--/* 5.10.2 / 5.12.2 -- 1re version : méthode POST + champ caché _method=PUT pour contourner la contrainte GET/POST des formulaires HTML
           (HiddenHttpMethodFilter, à activer dans application.properties).
           <form th:object="${programmeurToUpdate}" th:action="@{/programmeurs/{idProgrammeur}(idProgrammeur=${programmeurToUpdate.id})}" method="POST">
           <input type="hidden" name="_method" value="PUT" />
           Ces instructions se simplifient avec "th:method" (ci-dessous) : Thymeleaf envoie un POST et ajoute lui-même le champ caché _method. */-->
    <form th:object="${programmeurToUpdate}" th:action="@{/programmeurs/{idProgrammeur}(idProgrammeur=${programmeurToUpdate.id})}" th:method="PUT">

        <label class="form-label" for="nom">Nom</label>
        <input type="text" th:field="*{nom}" class="form-control mb-3 w-50">

        <label class="form-label" for="prenom">Prénom</label>
        <input type="text" th:field="*{prenom}" class="form-control mb-3 w-50">

        <label class="form-label" for="adresse">Adresse</label>
        <input type="text" th:field="*{adresse}" class="form-control mb-3 w-50">

        <label class="form-label" for="langageExpertise">Langage d'expertise</label>
        <input type="text" th:field="*{langageExpertise}" class="form-control mb-3 w-50">

        <label class="form-label" for="livrePrefere">Livre préféré</label>
        <input type="text" th:field="*{livrePrefere}" class="form-control mb-3 w-50">

        <!--/* type="number" step="any" : le navigateur envoie toujours le nombre avec un POINT décimal (45000.5), quelle que soit la langue du poste.
               Avec type="text", saisir "45000,5" provoquerait une erreur de conversion (400 Bad Request) car Double n'accepte pas la virgule. */-->
        <label class="form-label" for="salaire">Salaire</label>
        <input type="number" step="any" th:field="*{salaire}" class="form-control mb-3 w-50">

        <button type="submit" class="btn btn-primary">Validez</button>
    </form>

    <hr>
    <a th:href="@{/programmeurs}">Afficher la liste des programmeurs</a>
</div>
</body>
</html>
