<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|Affecter l'incident ${incident.id} · Rail Pulse|"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container page-content">
    <nav aria-label="Fil d'Ariane" class="mb-4"><a th:href="@{/}">Accueil</a> /
        <a th:href="@{/incidents/{id}(id=${incident.id})}" th:text="|Incident #${incident.id}|"></a> / Affectation</nav>
    <p class="section-label">SUIVI DES INCIDENTS</p>
    <h1 th:text="${incident.prestataire == null ? 'Affecter un prestataire' : 'Réaffecter le prestataire'}"></h1>
    <p><strong th:text="|Incident #${incident.id}|"></strong> · <span th:text="${incident.equipement.reference}"></span></p>
    <p th:if="${incident.prestataire != null}" th:text="|Prestataire actuel : ${incident.prestataire.nom}|"></p>
    <form class="form-card" method="post" th:object="${affectationPrestataire}"
          th:action="@{/incidents/{id}/affecter(id=${incident.id})}">
        <div class="alert alert-danger" role="alert" th:if="${#fields.hasErrors('*')}">Aucune affectation enregistrée. Corrigez le choix ci-dessous.</div>
        <label class="form-label" for="prestataireId">Prestataire</label>
        <select class="form-select" id="prestataireId" th:field="*{prestataireId}" th:attr="aria-invalid=${#fields.hasErrors('prestataireId')}">
            <option value="">Choisissez un prestataire</option>
            <option th:each="prestataire : ${prestataires}" th:value="${prestataire.id}"
                    th:text="|${prestataire.nom} · ${prestataire.contact}|"></option>
        </select>
        <p class="text-danger" th:if="${#fields.hasErrors('prestataireId')}" th:errors="*{prestataireId}"></p>
        <p th:if="${#lists.isEmpty(prestataires)}" class="text-secondary">Aucun prestataire disponible.</p>
        <div class="d-flex flex-wrap gap-3 mt-4">
            <button type="submit" class="btn btn-success" th:disabled="${#lists.isEmpty(prestataires)}">Enregistrer l'affectation</button>
            <a class="btn btn-outline-secondary" th:href="@{/incidents/{id}(id=${incident.id})}">Annuler</a>
        </div>
    </form>
</main>
</body>
</html>
