<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ALTN72 - Rail Pulse - Nouveau programmeur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Ajout d'un nouveau programmeur</h1>

    <!--/* 5.11 -- Formulaire d'ajout. Le contrôleur (preparerAjoutProgrammeur) dépose un Programmeur VIDE dans le Model sous le nom "nouveauProgrammeur" :
           th:object le rattache au formulaire, th:field="*{...}" lie chaque champ à un attribut (les champs sont vides car les attributs sont null).
           Ici un POST suffit (création) : pas besoin de _method. À la validation, le contrôleur reçoit les champs via @ModelAttribute,
           enregistre le programmeur, puis redirige vers la liste actualisée (5.11.2). */-->
    <form th:action="@{/programmeurs}" th:object="${nouveauProgrammeur}" method="POST">

        <label class="form-label" for="nom">Nom</label>
        <input type="text" th:field="*{nom}" class="form-control mb-3 w-50">

        <label class="form-label" for="prenom">Prénom</label>
        <input type="text" th:field="*{prenom}" class="form-control mb-3 w-50">

        <label class="form-label" for="adresse">Adresse</label>
        <input type="text" th:field="*{adresse}" class="form-control mb-3 w-50">

        <label class="form-label" for="langageExpertise">Langage d'expertise</label>
        <input type="text" th:field="*{langageExpertise}" class="form-control mb-3 w-50">

        <label class="form-label" for="livrePrefere">Livre préféré</label>
        <input type="text" th:field="*{livrePrefere}" class="form-control mb-3 w-50">

        <label class="form-label" for="salaire">Salaire</label>
        <input type="number" step="any" th:field="*{salaire}" class="form-control mb-3 w-50">

        <button type="submit" class="btn btn-primary">Enregistrez</button>
    </form>

    <hr>
    <a th:href="@{/programmeurs}">Afficher la liste des programmeurs</a>
</div>
</body>
</html>
