<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Déclarer un incident · Rail Pulse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container page-content">
    <nav aria-label="Fil d’Ariane" class="mb-4">
        <a th:href="@{/}">Accueil</a> / <a th:href="@{/stations}">Stations</a> /
        <a th:href="@{/equipements/{id}(id=${equipement.id})}" th:text="${equipement.reference}"></a> / Déclaration
    </nav>
    <p class="section-label">SIGNALEMENT</p>
    <h1>Déclarer un incident</h1>
    <p><strong th:text="${equipement.reference}"></strong> · <span th:text="${equipement.libelle}"></span> · <span th:text="${equipement.station.nom}"></span></p>
    <p class="text-secondary">L’incident sera daté automatiquement et restera en attente d’affectation.</p>
    <form class="form-card" method="post" th:object="${declarationIncident}"
          th:action="@{/equipements/{id}/incidents(id=${equipement.id})}">
        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger" role="alert">Aucun incident n’a été enregistré. Corrigez les informations ci-dessous.</div>
        <label for="description" class="form-label">Description du problème *</label>
        <textarea id="description" th:field="*{description}" class="form-control" rows="6" required
                  th:maxlength="${longueurDescriptionMax}" th:errorclass="is-invalid"
                  aria-describedby="description-aide description-erreur" th:attr="aria-invalid=${#fields.hasErrors('description')}"></textarea>
        <p id="description-aide" class="form-text" th:text="|Champ obligatoire, ${longueurDescriptionMax} caractères maximum. Précisez les symptômes et leur localisation.|"></p>
        <p id="description-erreur" class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
        <div class="d-flex flex-wrap gap-3 mt-4">
            <button type="submit" class="btn btn-success">Déclarer l’incident</button>
            <a class="btn btn-outline-secondary" th:href="@{/equipements/{id}(id=${equipement.id})}">Annuler</a>
        </div>
    </form>
</main>
</body>
</html>
