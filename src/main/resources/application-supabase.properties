# Identifiants PostgreSQL, distincts des clés de l'API Supabase.
spring.datasource.url=jdbc:postgresql://db.aehaxzwjhtkhqttvvqrd.supabase.co:5432/postgres?sslmode=require&connectTimeout=10&socketTimeout=30
spring.datasource.username=postgres
# Renseigner ici le vrai mot de passe PostgreSQL, qui n'a pas été fourni.
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=15000

# Schéma dédié : les tables ne sont pas créées dans public pour la Data API.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/supabase-schema.sql
spring.jpa.properties.hibernate.default_schema=railpulse
