spring.application.name=railpulse
railpulse.demo.agent-password=${RAILPULSE_DEMO_AGENT_PASSWORD:}
railpulse.demo.responsable-password=${RAILPULSE_DEMO_RESPONSABLE_PASSWORD:}
spring.profiles.default=supabase

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Gestion des erreurs
server.error.include-message=never
server.error.include-stacktrace=never

# Documentation OpenAPI (springdoc) : JSON sur /api/openapi, YAML sur /api/openapi.yaml
springdoc.api-docs.path=/api/openapi
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operations-sorter=method
