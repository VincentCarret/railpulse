name: Java 21 - verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-h2:
    name: Java 21 / H2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests, JAR et couverture
        run: bash ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        with:
          name: railpulse-verification-h2
          path: |
            target/railpulse-*.jar
            target/site/jacoco/
            target/surefire-reports/
          if-no-files-found: error

  tests-postgresql:
    name: Java 21 / PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: railpulse_test
          POSTGRES_USER: railpulse_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U railpulse_test -d railpulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/railpulse_test
      TEST_DB_DRIVER: org.postgresql.Driver
      TEST_DB_USERNAME: railpulse_test
      TEST_DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
      TEST_DB_SCHEMA: railpulse
      TEST_DB_SCHEMA_F4: railpulse_f4
      TEST_DB_SCHEMA_SUIVI: railpulse_suivi
      TEST_DB_SCHEMA_DEMO: railpulse_demo
      TEST_DB_INIT: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests et export SQL natif sur PostgreSQL isole
        run: bash ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: railpulse-verification-postgresql
          path: target/surefire-reports/
          if-no-files-found: warn
